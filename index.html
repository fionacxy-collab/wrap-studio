<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Wrap Studio - 人像转礼品包装纸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        
        .bg-macaron {
            background: linear-gradient(135deg, #e0f7fa 0%, #f3e5f5 25%, #fff3e0 50%, #e8f5e9 75%, #e3f2fd 100%);
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f48fb1 0%, #ce93d8 100%);
            box-shadow: 0 4px 15px rgba(244, 143, 177, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 143, 177, 0.5);
        }
        
        .upload-zone {
            border: 3px dashed #86efac;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #f48fb1;
            background: rgba(244, 143, 177, 0.1);
            transform: scale(1.02);
        }
        
        .style-card {
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .style-card:hover {
            transform: translateY(-4px);
        }
        
        .style-card.selected {
            border-color: #f48fb1;
            box-shadow: 0 0 0 4px rgba(244, 143, 177, 0.2);
        }
        
        .loading-ring {
            border: 4px solid rgba(244, 143, 177, 0.2);
            border-top-color: #f48fb1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .pattern-bg {
            background-size: 100px 100px;
        }
    </style>
</head>
<body class="min-h-screen bg-macaron">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef } = React;
        
        // 风格配置
        const STYLES = [
            { 
                id: 'kawaii', 
                name: '🐰 萌萌可爱', 
                desc: '粉嫩圆润，超治愈',
                prompt: 'cute kawaii cartoon style, pastel colors, soft lighting, chibi style, adorable, pink and purple tones, heart decorations, fluffy texture'
            },
            { 
                id: 'pastel', 
                name: '🧁 马卡龙', 
                desc: '柔和梦幻，少女心',
                prompt: 'pastel macaron color palette, soft dreamy atmosphere, watercolor texture, mint green, baby pink, lavender, light yellow, gentle gradients'
            },
            { 
                id: 'fresh', 
                name: '🌿 清新自然', 
                desc: '绿意盎然，很舒服',
                prompt: 'fresh nature style, botanical elements, green leaves, flower patterns, mint and sage colors, organic shapes, natural lighting, eco-friendly vibe'
            },
            { 
                id: 'ocean', 
                name: '🐳 海洋泡泡', 
                desc: '清凉透亮，夏日感',
                prompt: 'ocean bubbles style, underwater theme, blue and cyan gradients, bubble patterns, wave textures, refreshing summer vibe, light blue tones'
            },
            { 
                id: 'retro', 
                name: '🌸 复古昭和', 
                desc: '怀旧温柔，日系风',
                prompt: 'retro Showa era style, Japanese vintage aesthetic, soft faded colors, nostalgic atmosphere, cherry blossoms, gentle sepia tones, film grain texture'
            },
            { 
                id: 'galaxy', 
                name: '✨ 星空梦幻', 
                desc: '璀璨星河，神秘感',
                prompt: 'galaxy cosmic style, starry night pattern, deep purple and blue, nebula clouds, glitter stars, space theme, magical atmosphere, sparkling effects'
            }
        ];
        
        // 使用占位图片 + 滤镜模拟不同风格
        const generateWrappingPaper = (styleId) => {
            // 使用 picsum 随机图片作为基础
            const seed = Math.floor(Math.random() * 1000);
            const baseUrl = `https://picsum.photos/seed/${seed}/1024/1024`;
            
            // 根据风格返回不同的占位图和滤镜
            const styles = {
                kawaii: { 
                    url: `https://placehold.co/1024x1024/ffdbec/ff69b4/png?text=🐰+Kawaii+Pattern`,
                    filter: 'saturate(1.5) brightness(1.1)'
                },
                pastel: { 
                    url: `https://placehold.co/1024x1024/e6e6fa/da70d6/png?text=🧁+Pastel+Pattern`,
                    filter: 'saturate(0.8) brightness(1.1)'
                },
                fresh: { 
                    url: `https://placehold.co/1024x1024/90EE90/228B22/png?text=🌿+Fresh+Pattern`,
                    filter: 'saturate(1.3) hue-rotate(10deg)'
                },
                ocean: { 
                    url: `https://placehold.co/1024x1024/87CEEB/4682B4/png?text=🐳+Ocean+Pattern`,
                    filter: 'saturate(1.2) hue-rotate(180deg)'
                },
                retro: { 
                    url: `https://placehold.co/1024x1024/FFE4E1/DB7093/png?text=🌸+Retro+Pattern`,
                    filter: 'sepia(0.3) saturate(1.1)'
                },
                galaxy: { 
                    url: `https://placehold.co/1024x1024/9370DB/4B0082/png?text=✨+Galaxy+Pattern`,
                    filter: 'saturate(1.4) contrast(1.2)'
                }
            };
            
            return styles[styleId] || styles.kawaii;
        };
        
        function App() {
            const [step, setStep] = useState(1);
            const [image, setImage] = useState(null);
            const [selectedStyle, setSelectedStyle] = useState(STYLES[0]);
            const [loading, setLoading] = useState(false);
            const [generatedUrl, setGeneratedUrl] = useState(null);
            const [generatedFilter, setGeneratedFilter] = useState('');
            const fileRef = useRef(null);
            const [dragOver, setDragOver] = useState(false);
            
            // 处理文件上传
            const handleFile = (file) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        setImage(e.target.result);
                        setStep(2);
                    };
                    reader.readAsDataURL(file);
                }
            };
            
            // 生成包装纸
            const handleGenerate = () => {
                if (!selectedStyle) return;
                
                setLoading(true);
                setStep(3);
                
                // 生成占位图
                const result = generateWrappingPaper(selectedStyle.id);
                setGeneratedUrl(result.url);
                setGeneratedFilter(result.filter);
                
                // 模拟加载延迟
                setTimeout(() => {
                    setLoading(false);
                    setStep(4);
                }, 1500);
            };
            
            // 重新开始
            const handleReset = () => {
                setStep(1);
                setImage(null);
                setGeneratedUrl(null);
                setGeneratedFilter('');
                setSelectedStyle(STYLES[0]);
            };
            
            return (
                <div className="min-h-screen p-4 md:p-8">
                    {/* 装饰背景 */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute w-32 h-32 bg-pink-300 rounded-full opacity-40 blur-3xl top-10 left-10 animate-float"></div>
                        <div className="absolute w-24 h-24 bg-blue-300 rounded-full opacity-40 blur-3xl top-40 right-20 animate-float" style={{animationDelay: '1s'}}></div>
                        <div className="absolute w-20 h-20 bg-green-300 rounded-full opacity-40 blur-3xl bottom-40 left-20 animate-float" style={{animationDelay: '2s'}}></div>
                    </div>
                    
                    <div className="max-w-4xl mx-auto relative z-10">
                        {/* 标题 */}
                        <header className="text-center mb-10">
                            <div className="text-6xl mb-4 animate-float">🎁</div>
                            <h1 className="text-4xl md:text-5xl font-bold text-gray-800 mb-3">
                                Wrap Studio
                            </h1>
                            <p className="text-gray-600 text-lg">✨ 免费 AI 礼品包装纸生成器</p>
                        </header>
                        
                        {/* 步骤指示器 */}
                        <div className="flex justify-center mb-10">
                            <div className="flex items-center gap-2 bg-white/70 px-6 py-3 rounded-full shadow-lg">
                                {[
                                    { num: 1, label: '上传', icon: '📸' },
                                    { num: 2, label: '风格', icon: '🎨' },
                                    { num: 3, label: '生成', icon: '✨' },
                                    { num: 4, label: '下载', icon: '💾' }
                                ].map((s, i) => (
                                    <React.Fragment key={s.num}>
                                        <div className={`flex items-center gap-2 px-3 py-2 rounded-full transition-all ${
                                            step >= s.num ? 'bg-gradient-to-r from-pink-300 to-purple-300 text-white' : 'bg-gray-100 text-gray-400'
                                        }`}>
                                            <span>{s.icon}</span>
                                            <span className="hidden sm:inline text-sm font-bold">{s.label}</span>
                                        </div>
                                        {i < 3 && <div className="w-4 h-1 bg-gray-200 rounded"></div>}
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                        
                        {/* 步骤 1: 上传 */}
                        {step === 1 && (
                            <div className="glass rounded-3xl p-8 text-center">
                                <div 
                                    className={`upload-zone rounded-3xl p-12 cursor-pointer ${dragOver ? 'dragover' : ''}`}
                                    onClick={() => fileRef.current?.click()}
                                    onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                                    onDragLeave={() => setDragOver(false)}
                                    onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
                                >
                                    <div className="text-6xl mb-4">📸</div>
                                    <p className="text-xl text-gray-700 mb-2 font-bold">点击或拖拽上传照片</p>
                                    <p className="text-gray-400 text-sm">支持 JPG、PNG 格式</p>
                                    <input 
                                        type="file" 
                                        ref={fileRef} 
                                        className="hidden" 
                                        accept="image/*"
                                        onChange={(e) => handleFile(e.target.files[0])}
                                    />
                                </div>
                                
                                <div className="flex justify-center gap-4 mt-6">
                                    <span className="bg-pink-100 text-pink-600 px-4 py-2 rounded-full text-sm">✨ 免费生成</span>
                                    <span className="bg-purple-100 text-purple-600 px-4 py-2 rounded-full text-sm">🔒 隐私保护</span>
                                </div>
                            </div>
                        )}
                        
                        {/* 步骤 2: 选择风格 */}
                        {step === 2 && (
                            <div className="glass rounded-3xl p-8">
                                <div className="flex items-center gap-4 mb-6">
                                    <button onClick={handleReset} className="text-gray-400 hover:text-gray-600">← 返回</button>
                                    <h2 className="text-2xl font-bold text-gray-800">选择喜欢的风格</h2>
                                </div>
                                
                                {/* 预览原图 */}
                                <div className="mb-6 flex justify-center">
                                    <img src={image} className="w-32 h-32 object-cover rounded-2xl shadow-lg" alt="上传的照片" />
                                </div>
                                
                                {/* 风格选择 */}
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                                    {STYLES.map(style => (
                                        <div 
                                            key={style.id}
                                            className={`style-card bg-white rounded-2xl p-5 cursor-pointer text-center ${selectedStyle.id === style.id ? 'selected' : ''}`}
                                            onClick={() => setSelectedStyle(style)}
                                        >
                                            <div className="text-4xl mb-2">{style.name.split(' ')[0]}</div>
                                            <div className="font-bold text-gray-800">{style.name.split(' ')[1]}</div>
                                            <div className="text-sm text-gray-500 mt-1">{style.desc}</div>
                                        </div>
                                    ))}
                                </div>
                                
                                <button 
                                    onClick={handleGenerate} 
                                    className="btn-primary w-full py-4 rounded-full text-white font-bold text-lg"
                                >
                                    ✨ 开始免费生成
                                </button>
                            </div>
                        )}
                        
                        {/* 步骤 3: 生成中 */}
                        {step === 3 && loading && (
                            <div className="glass rounded-3xl p-12 text-center">
                                <div className="loading-ring w-20 h-20 mx-auto mb-6"></div>
                                <p className="text-2xl font-bold text-gray-800 mb-2">正在生成中...</p>
                                <p className="text-gray-500">演示版：使用占位图 + CSS 滤镜</p>
                            </div>
                        )}
                        
                        {/* 步骤 4: 结果 */}
                        {step === 4 && generatedUrl && (
                            <div className="glass rounded-3xl p-8">
                                <div className="text-center mb-6">
                                    <div className="text-5xl mb-3">🎉</div>
                                    <h2 className="text-2xl font-bold text-gray-800">完成啦！</h2>
                                </div>
                                
                                {/* 生成的图案 */}
                                <div className="mb-6">
                                    <p className="text-gray-600 mb-3 text-center">包装纸图案（演示版）：</p>
                                    <div className="rounded-2xl overflow-hidden shadow-xl border-4 border-white">
                                        <img 
                                            src={generatedUrl} 
                                            alt="生成的包装纸" 
                                            className="w-full h-auto"
                                            style={{
                                                imageRendering: 'crisp-edges',
                                                filter: generatedFilter
                                            }}
                                        />
                                    </div>
                                    <p className="text-sm text-gray-400 mt-2 text-center">💡 演示版：真实 AI 生成需要后端支持</p>
                                </div>
                                
                                {/* 预览效果 */}
                                <div className="mb-6 bg-gradient-to-br from-pink-100 to-purple-100 rounded-2xl p-6 text-center">
                                    <p className="text-gray-600 mb-3">礼盒预览效果：</p>
                                    <div className="inline-block relative">
                                        <div className="w-40 h-40 rounded-2xl shadow-xl pattern-bg" style={{
                                            backgroundImage: `url(${generatedUrl})`,
                                            backgroundSize: '80px 80px',
                                            filter: generatedFilter
                                        }}></div>
                                        <div className="absolute top-0 bottom-0 left-1/2 w-4 -translate-x-1/2 bg-gradient-to-b from-yellow-300 to-orange-400"></div>
                                        <div className="absolute left-0 right-0 top-1/2 h-4 -translate-y-1/2 bg-gradient-to-r from-yellow-300 to-orange-400"></div>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-red-400 rounded-full shadow-lg"></div>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <a 
                                        href={generatedUrl}
                                        download={`wrap-studio-${selectedStyle.id}.png`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="btn-primary flex-1 py-4 rounded-full text-white font-bold text-center block"
                                    >
                                        💾 查看并下载图片
                                    </a>
                                    <button 
                                        onClick={handleReset}
                                        className="bg-gray-100 text-gray-600 px-6 py-4 rounded-full font-bold hover:bg-gray-200 transition"
                                    >
                                        🔄 再来一张
                                    </button>
                                </div>
                                
                                <p className="text-center text-sm text-gray-400 mt-4">
                                    演示版：真实 AI 生成需要后端支持
                                </p>
                            </div>
                        )}
                        
                        {/* 说明 */}
                        <div className="mt-10 text-center text-gray-500 text-sm">
                            <p>🎨 演示版本：使用占位图 + CSS 滤镜模拟效果</p>
                            <p className="mt-2">真实 AI 生成需要接入后端 API（如 Replicate、Midjourney 等）</p>
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
